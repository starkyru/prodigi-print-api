name: Publish

on:
  push:
    branches: [main, test]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Bump the patch version, unless package.json was already bumped
      # deliberately (a minor/major release), in which case publish it as-is.
      - name: Bump version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin ${{ github.ref_name }} --rebase

          CURRENT=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view prodigi-print-api version 2>/dev/null || echo "")

          if [ -n "${PUBLISHED}" ] && [ "${CURRENT}" != "${PUBLISHED}" ]; then
            echo "package.json is at ${CURRENT}, npm latest is ${PUBLISHED} — publishing as-is."
          else
            npm version patch --no-git-tag-version
          fi

          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.ref_name }}" = "test" ]; then
            npm version "${VERSION}-test" --no-git-tag-version
          fi
          NEW_VERSION=$(node -p "require('./package.json').version")
          git add package.json package-lock.json
          # No-op when the version was already committed on the branch.
          git commit -m "v${NEW_VERSION}" || echo "No version change to commit."
          git tag "v${NEW_VERSION}"
          git push origin ${{ github.ref_name }} --tags

      # Publish via OIDC trusted publishing (no token needed)
      - name: Publish to npm
        run: |
          if [ "${{ github.ref_name }}" = "test" ]; then
            npm publish --provenance --access public --tag test
          else
            npm publish --provenance --access public
          fi
